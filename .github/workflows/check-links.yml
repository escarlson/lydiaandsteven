name: Check External Links

on:
  pull_request:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
            --header 'User-Agent: Mozilla/5.0 (compatible; lychee-link-checker/1.0; +https://github.com/lycheeverse/lychee)'
            --exclude 'localhost'
            --exclude 'nominatim\.openstreetmap\.org'
            --exclude '\$\{'
            --exclude 'sunrise-sunset\.org'
            --include-verbatim
            './app/**/*.tsx'
            './app/**/*.ts'
            './app/**/*.jsx'
            './app/**/*.js'
          fail: true
